deployment:
  runtime: github-pages
  repository: Inov8mktg/i8-master-media-feed-adapter
  feed_url: https://inov8mktg.github.io/i8-master-media-feed-adapter/feed.atom
  workflow: .github/workflows/deploy-pages.yml
